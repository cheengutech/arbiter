<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbiter — Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#010409;--bg2:#04080f;--bg3:#060c18;
  --border:rgba(0,180,255,0.08);--border2:rgba(0,180,255,0.15);
  --text:#e8f4ff;--muted:#6a9abf;--dim:#2a5070;
  --blue:#4a9eff;--blue2:#7ec8ff;--cyan:#00e5ff;
  --crit:#ff4466;--warn:#ffaa40;--ok:#00e5a0;
  --mono:'IBM Plex Mono',monospace;--serif:'Barlow Condensed',sans-serif;--sans:'IBM Plex Sans',sans-serif;
  --zone-ok:rgba(0,100,60,0.35);--zone-warn:rgba(120,80,0,0.45);--zone-crit:rgba(120,20,30,0.5);--zone-dim:rgba(0,30,60,0.3);
}
html,body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;overflow-x:hidden}

/* NAV */
nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 40px;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
  background:rgba(1,4,9,0.96);backdrop-filter:blur(8px);
}
.nav-logo{font-size:22px;font-weight:500;letter-spacing:.14em;color:var(--blue2)}
.nav-logo span{color:var(--dim)}
.nav-center{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;color:var(--dim)}
.nav-sep{color:var(--dim);opacity:.4}
.nav-r{display:flex;align-items:center;gap:20px}
.live-dot-wrap{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;color:var(--ok)}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--ok);animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.nav-time{font-size:11px;color:var(--dim)}
.nav-link{font-size:10px;letter-spacing:.1em;color:var(--muted);text-decoration:none;text-transform:uppercase;transition:color .15s}
.nav-link:hover{color:var(--text)}

/* STATUS BAR */
.status-bar{
  display:flex;border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;background:var(--bg2);
}
.status-bar::-webkit-scrollbar{display:none}
.sb-cell{
  flex:1;min-width:140px;padding:10px 20px;
  border-right:1px solid var(--border);
}
.sb-cell:last-child{border-right:none}
.sb-label{font-size:9px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-bottom:4px}
.sb-val{font-size:15px;font-weight:500;color:var(--text)}
.sb-val.ok{color:var(--ok)}.sb-val.warn{color:var(--warn)}.sb-val.crit{color:var(--crit)}

/* BUILDING TABS */
.bldg-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.bldg-tabs::-webkit-scrollbar{display:none}
.bldg-tab{
  font-size:10px;letter-spacing:.1em;color:var(--muted);
  padding:12px 28px;cursor:pointer;white-space:nowrap;
  text-transform:uppercase;border-bottom:2px solid transparent;
  transition:all .2s;user-select:none;
}
.bldg-tab:hover{color:var(--text);background:var(--bg2)}
.bldg-tab.active{color:var(--blue);border-bottom-color:var(--blue);background:var(--bg2)}

/* MAIN LAYOUT */
.main{display:grid;grid-template-columns:1fr 280px;height:calc(100vh - 130px);overflow:hidden}

/* FLOOR PLAN PANEL */
.fp-panel{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.fp-header{
  padding:10px 20px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  background:var(--bg2);flex-shrink:0;
}
.fp-title{font-size:10px;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
.fp-subtitle{font-size:9px;letter-spacing:.08em;color:var(--dim)}
.fp-wrap{flex:1;overflow:auto;padding:16px;display:flex;align-items:center;justify-content:center}

/* SVG zone styles */
.fp-svg{max-width:100%;max-height:100%}
.zone-room{cursor:pointer;transition:all .2s}
.zone-room:hover .zone-bg{filter:brightness(1.3)}
.zone-bg{fill:var(--zone-ok);stroke:rgba(0,180,255,0.2);stroke-width:1;rx:2}
.zone-bg.warn{fill:var(--zone-warn);stroke:rgba(255,170,64,0.3)}
.zone-bg.crit{fill:var(--zone-crit);stroke:rgba(255,68,102,0.4)}
.zone-bg.dim{fill:var(--zone-dim);stroke:rgba(0,100,180,0.15)}
.zone-label{font-family:'IBM Plex Mono',monospace;font-size:8px;fill:rgba(180,220,255,0.5);letter-spacing:.08em}
.zone-value{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;fill:rgba(220,240,255,0.9)}
.zone-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:rgba(100,160,220,0.6)}
.zone-icon{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:rgba(100,160,220,0.5)}
.struct-fill{fill:rgba(0,20,50,0.4);stroke:rgba(0,80,140,0.15);stroke-width:0.5}
.corridor-fill{fill:rgba(0,15,35,0.3);stroke:rgba(0,60,120,0.1);stroke-width:0.5}
.struct-label{font-family:'IBM Plex Mono',monospace;font-size:7px;fill:rgba(60,120,180,0.35);letter-spacing:.1em}

/* ALARM SIDEBAR */
.alarm-sidebar{display:flex;flex-direction:column;overflow:hidden}
.alarm-header{
  padding:10px 16px;border-bottom:1px solid var(--border);
  background:var(--bg2);flex-shrink:0;
}
.alarm-title{font-size:10px;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
.alarm-summary{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.sum-cell{padding:12px 8px;text-align:center;border-right:1px solid var(--border)}
.sum-cell:last-child{border-right:none}
.sum-num{font-size:22px;font-family:var(--serif);font-weight:800;line-height:1}
.sum-num.crit{color:var(--crit)}.sum-num.warn{color:var(--warn)}.sum-num.clr{color:var(--ok)}
.sum-lbl{font-size:8px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-top:3px}
.alarm-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.alarm-item{
  padding:10px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.alarm-item:hover{background:var(--bg2)}
.alarm-item.crit{border-left:2px solid var(--crit)}
.alarm-item.warn{border-left:2px solid var(--warn)}
.alarm-item.clr{border-left:2px solid var(--ok)}
.ai-zone{font-size:9px;letter-spacing:.08em;color:var(--blue);text-transform:uppercase;margin-bottom:3px}
.ai-desc{font-size:11px;color:var(--text);margin-bottom:2px}
.ai-val{font-size:10px;color:var(--muted)}
.ai-time{font-size:9px;color:var(--dim);margin-top:3px}
.alarm-empty{padding:24px 14px;font-size:11px;color:var(--dim);text-align:center}

/* LEGEND */
.legend{
  display:flex;gap:16px;padding:8px 16px;
  border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.06em;color:var(--dim)}
.ld{width:10px;height:10px}
.ld-ok{background:var(--zone-ok);border:1px solid rgba(0,180,100,0.3)}
.ld-warn{background:var(--zone-warn);border:1px solid rgba(255,170,64,0.3)}
.ld-crit{background:var(--zone-crit);border:1px solid rgba(255,68,102,0.3)}
</style>
</head>
<body>

<nav>
  <div style="display:flex;align-items:center;gap:20px">

// shared zone SVG builder
function zone(x,y,w,h,id,cls,val,sub,label){
  return '<g class="zone-room" id="zone-'+id+'">'+
    '<rect class="zone-bg '+cls+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2"/>'+
    '<text class="zone-label" x="'+(x+w/2)+'" y="'+(y+h*0.32)+'" text-anchor="middle">'+label+'</text>'+
    '<text class="zone-value" x="'+(x+w/2)+'" y="'+(y+h*0.58)+'" text-anchor="middle">'+val+'</text>'+
    (sub?'<text class="zone-sub" x="'+(x+w/2)+'" y="'+(y+h*0.76)+'" text-anchor="middle">'+sub+'</text>':'')+
    '</g>';
}

// ── RENDER ────────────────────────────────────────────────────────────────────
var activeBldg='legion';

function render(id){
  activeBldg=id;
  var b=BUILDINGS[id];
  if(!b)return;

  document.getElementById('nav-bldg').textContent=b.name;
  document.getElementById('fp-title').textContent='// '+b.title;
  document.getElementById('fp-subtitle').textContent=b.subtitle;

  // status bar
  var sb=document.getElementById('status-bar');
  sb.innerHTML=b.status.map(function(s){
    return '<div class="sb-cell"><div class="sb-label">'+s.label+'</div><div class="sb-val '+s.cls+'">'+s.val+'</div></div>';
  }).join('');

  // floor plan
  document.getElementById('fp-wrap').innerHTML=b.svg(b.zones);

  // legend
  document.getElementById('legend').innerHTML=b.legend.map(function(l){
    return '<div class="legend-item"><div class="ld '+l.cls+'"></div>'+l.label+'</div>';
  }).join('');

  // alarm list
  var al=document.getElementById('alarm-list');
  var crit=0,warn=0,clr=0;
  if(!b.alarms||!b.alarms.length){
    al.innerHTML='<div class="alarm-empty">No active alarms</div>';
  } else {
    al.innerHTML=b.alarms.map(function(a){
      if(a.cls==='crit')crit++;
      else if(a.cls==='warn')warn++;
      else clr++;
      return '<div class="alarm-item '+a.cls+'">'+
        '<div class="ai-zone">'+a.zone+'</div>'+
        '<div class="ai-desc">'+a.desc+'</div>'+
        '<div class="ai-val">'+a.val+'</div>'+
        '<div class="ai-time">'+a.time+'</div>'+
        '</div>';
    }).join('');
  }
  document.getElementById('cnt-crit').textContent=crit;
  document.getElementById('cnt-warn').textContent=warn;
  document.getElementById('cnt-clr').textContent=clr;
}

// tab clicks
document.querySelectorAll('.bldg-tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelector('.bldg-tab.active').classList.remove('active');
    t.classList.add('active');
    render(t.dataset.bldg);
  });
});

// WebSocket
var WS_URL='wss://arbiter-iq7x.onrender.com/ws/alarms';
var ws=null,reconnectTimer=null;
function connectWS(){
  if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;
  ws=new WebSocket(WS_URL);
  ws.onopen=function(){if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null;}};
  ws.onclose=function(){reconnectTimer=setTimeout(connectWS,3000);};
  ws.onerror=function(){ws.close();};
}
setInterval(function(){if(ws&&ws.readyState===WebSocket.OPEN)ws.send('ping');},30000);
connectWS();

// init
render('legion');
